
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>URL Shortener</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h1>URL Shortener</h1>

  <p>Shorten your long URL easily</p>

  <div class="url-box">

    <input
      type="url"
      id="longUrl"
      placeholder="Enter your long URL"
      required
    >

    <button id="shortenBtn">
      Shorten URL
    </button>

  </div>

  <div id="result" class="result">

    <p>Your Short URL:</p>

    <a
      id="shortUrl"
      href="#"
      target="_blank"
    ></a>

    <button id="copyBtn">
      Copy
    </button>

  </div>

</div>

<script src="app.js"></script>

</body>

</html>
